<div
  class="progress"
  role="progressbar"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-valuenow]="clampedValue()"
  [attr.aria-label]="label()"
>
  <div class="progress-track">
    <div class="progress-fill" [style.width.%]="clampedValue()"></div>
  </div>
  <div class="progress-meta">
    <span>{{ label() }}</span>
    <strong>{{ clampedValue() }}%</strong>
  </div>
</div>
